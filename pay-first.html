<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ادفع الأول</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:#0d0d0d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Tahoma', 'Segoe UI', sans-serif;
    overflow:hidden;
  }
  .msg{
    text-align:center;
    padding:40px;
    max-width:700px;
  }
  .msg h1{
    color:#ff3b30;
    font-size:clamp(28px, 6vw, 56px);
    font-weight:900;
    line-height:1.4;
    text-shadow:0 0 25px rgba(255,59,48,.5);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.04);}
  }
</style>
</head>
<body>
  <div class="msg">
    <h1>ادفع الفلوس اللي عليك الأول<br>عشان تستلم موقعك</h1>
  </div>
</body>
</html>
