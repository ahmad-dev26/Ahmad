<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة المالك للتسويق العقاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#F6F2EA;
  --stone-dim:#EDE6D8;
  --ink:#22201C;
  --navy:#1B3A4B;
  --navy-dim:#28495D;
  --brick:#A6472F;
  --brick-dim:#8C3A26;
  --gold:#B8902E;
  --line:#DCD3C0;
  --sale:#1B3A4B;
  --rent:#A6472F;
  --display:'El Messiri', serif;
  --body:'Tajawal', sans-serif;
  --data:'IBM Plex Sans Arabic', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--body);
  background:var(--stone);
  color:var(--ink);
  min-height:100vh;
  line-height:1.5;
}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input, select{font-family:inherit;}
::selection{background:var(--gold); color:var(--stone);}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
.topbar{
  background:var(--navy);
  color:var(--stone);
  padding:18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--gold);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--display);
  font-size:22px;
  font-weight:700;
  cursor:pointer;
}
.brand-mark{
  width:38px; height:38px;
  border:2px solid var(--gold);
  border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold);
  font-family:var(--display);
  font-size:19px;
}
.brand small{
  display:block;
  font-family:var(--data);
  font-size:11px;
  font-weight:400;
  color:#C9BFA8;
  letter-spacing:.5px;
}
.crumb{
  font-family:var(--data);
  font-size:14px;
  color:#C9BFA8;
}
.crumb b{color:var(--stone); font-weight:600;}
.hero{
  padding:56px 28px 20px;
  text-align:center;
  max-width:900px;
  margin:0 auto;
}
.hero-eyebrow{
  font-family:var(--data);
  font-size:13px;
  letter-spacing:2px;
  color:var(--brick);
  font-weight:600;
}
.hero h1{
  font-family:var(--display);
  font-size:clamp(30px,5vw,46px);
  margin:10px 0 14px;
  color:var(--navy);
}
.hero p{
  color:#54514A;
  font-size:16px;
  max-width:560px;
  margin:0 auto;
}
.home-search{
  max-width:560px;
  margin:26px auto 0;
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:6px;
  padding:6px 6px 6px 16px;
}
.home-search:focus-within{border-color:var(--navy);}
.home-search-icon{
  width:20px; height:20px;
  color:#8A8577;
  flex-shrink:0;
}
.home-search-icon svg{width:100%; height:100%;}
.home-search input{
  flex:1;
  border:none;
  outline:none;
  font-size:15px;
  padding:10px 0;
  background:transparent;
  color:var(--ink);
}
.home-search input::placeholder{color:#A7A18E;}
.home-search .btn{flex-shrink:0;}
.categories{
  max-width:1080px;
  margin:40px auto 60px;
  padding:0 28px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
}
@media (max-width:860px){
  .categories{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:480px){
  .categories{grid-template-columns:1fr;}
}
.cat-card{
  --accent:var(--navy);
  --accent-dim:var(--navy-dim);
  background:var(--accent);
  color:#fff;
  border:1px solid var(--accent);
  border-radius:6px;
  padding:26px 18px;
  text-align:center;
  position:relative;
  overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.cat-card::before{
  content:"";
  position:absolute; inset:0 0 auto 0;
  height:4px;
  background:var(--gold);
  transform:scaleX(0);
  transform-origin:right;
  transition:transform .25s ease;
}
.cat-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 30px -18px rgba(0,0,0,.45);
  background:var(--accent-dim);
}
.cat-card:hover::before{transform:scaleX(1);}
.cat-card:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.cat-card.accent-navy{ --accent:var(--navy); --accent-dim:#123040; }
.cat-card.accent-brick{ --accent:var(--brick); --accent-dim:var(--brick-dim); }
.cat-card.accent-gold{ --accent:var(--gold); --accent-dim:#9c7a24; }
.cat-card.accent-green{ --accent:#3F6B3F; --accent-dim:#345a34; }
.cat-icon{
  width:56px; height:56px;
  margin:0 auto 14px;
  color:#fff;
}
.cat-icon svg{width:100%; height:100%;}
.cat-card h3{
  font-family:var(--display);
  font-size:19px;
  color:#fff;
  margin-bottom:6px;
}
.cat-count{
  font-family:var(--data);
  font-size:13px;
  color:rgba(255,255,255,.8);
}
.cat-count b{color:#fff; font-weight:700;}
.section-title.accent-navy{ color:var(--navy); }
.section-title.accent-navy .cat-icon{ color:var(--navy); }
.section-title.accent-brick{ color:var(--brick); }
.section-title.accent-brick .cat-icon{ color:var(--brick); }
.section-title.accent-gold{ color:#9c7a24; }
.section-title.accent-gold .cat-icon{ color:#9c7a24; }
.section-title.accent-green{ color:#3F6B3F; }
.section-title.accent-green .cat-icon{ color:#3F6B3F; }
.section-head{
  max-width:1080px;
  margin:34px auto 0;
  padding:0 28px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.section-title{
  font-family:var(--display);
  font-size:28px;
  color:var(--navy);
  display:flex;
  align-items:center;
  gap:10px;
}
.section-title .cat-icon{width:34px; height:34px; margin:0;}
.btn{
  font-family:var(--body);
  font-weight:700;
  font-size:14px;
  padding:11px 20px;
  border-radius:4px;
  transition:background .15s ease, transform .1s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:var(--brick);
  color:#fff;
}
.btn-primary:hover{background:var(--brick-dim);}
.btn-ghost{
  background:transparent;
  color:var(--navy);
  border:1.5px solid var(--navy);
}
.btn-ghost:hover{background:var(--navy); color:#fff;}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.toolbar{
  max-width:1080px;
  margin:22px auto 0;
  padding:0 28px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}
.search-box{
  flex:1 1 260px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:11px 14px 11px 14px;
  border:1.5px solid var(--line);
  border-radius:4px;
  background:#fff;
  font-size:14px;
  color:var(--ink);
}
.search-box input:focus{outline:none; border-color:var(--navy);}
.search-box input::placeholder{color:#A7A18E;}
.filter-pills{
  display:flex; gap:8px; flex-wrap:wrap;
}
.pill{
  padding:9px 16px;
  border-radius:20px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:13px;
  font-weight:700;
  color:#6B6858;
  transition:all .15s ease;
}
.pill.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.pill:hover:not(.active){border-color:var(--navy); color:var(--navy);}
.result-count{
  max-width:1080px;
  margin:16px auto 0;
  padding:0 28px;
  font-family:var(--data);
  font-size:13px;
  color:#8A8577;
}
.listings{
  max-width:1080px;
  margin:0 auto;
  padding:16px 28px 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
  gap:18px;
}
.property-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:6px;
  padding:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
}
.card-tab{
  padding:9px 16px;
  font-family:var(--data);
  font-size:12px;
  font-weight:600;
  letter-spacing:.5px;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.card-tab.sale{background:var(--sale);}
.card-tab.rent{background:var(--rent);}
.card-tab.land-alt{background:#5B7A5E;}
.card-tab.plain{background:var(--gold);}
.card-media{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
  background:#22201C;
}
.card-body{padding:16px 18px 18px;}
.card-desc{
  font-family:var(--body);
  font-size:13px;
  line-height:1.7;
  color:#54514A;
  border-top:1px dashed var(--line);
  margin-top:12px;
  padding-top:12px;
}
.card-region{
  font-family:var(--display);
  font-size:19px;
  color:var(--ink);
  margin-bottom:6px;
}
.card-address{
  font-family:var(--body);
  font-size:13px;
  color:#8A8577;
  margin-bottom:10px;
}
.card-price{
  font-family:var(--data);
  font-size:20px;
  font-weight:600;
  color:var(--brick);
  margin-bottom:14px;
}
.card-price span{font-size:13px; color:#8A8577; font-weight:400;}
.card-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 10px;
  font-family:var(--data);
  font-size:13px;
  color:#54514A;
  border-top:1px dashed var(--line);
  padding-top:12px;
}
.card-meta div b{
  display:block;
  color:#A7A18E;
  font-weight:400;
  font-size:11px;
  margin-bottom:2px;
}
.card-actions{
  display:flex;
  border-top:1px solid var(--line);
}
.card-actions button{
  flex:1;
  padding:11px 6px;
  font-size:12px;
  font-weight:700;
  font-family:var(--body);
}
.card-actions button:not(:last-child){border-inline-end:1px solid var(--line);}
.card-call{color:var(--navy);}
.card-call:hover{background:var(--stone-dim);}
.card-delete{color:var(--brick);}
.card-delete:hover{background:#FBEDE9;}
.card-edit{color:#9c7a24;}
.card-edit:hover{background:#FBF3DE;}
.card-copy{color:#4A6B57;}
.card-copy:hover{background:#EAF1EC;}
.empty-state{
  max-width:1080px;
  margin:20px auto 60px;
  padding:60px 28px;
  text-align:center;
  color:#8A8577;
}
.empty-state h3{
  font-family:var(--display);
  color:var(--navy);
  font-size:20px;
  margin-bottom:8px;
}
.overlay{
  position:fixed; inset:0;
  background:rgba(27,26,20,.55);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
   z-index:50;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{
  background:var(--stone);
  border-radius:6px;
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow-y:auto;
  border-top:4px solid var(--gold);
}
.modal-head{
  padding:20px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}
.modal-head h2{
  font-family:var(--display);
  font-size:21px;
  color:var(--navy);
}
.modal-close{
  font-size:20px;
  color:#8A8577;
  width:30px; height:30px;
  border-radius:4px;
}
.modal-close:hover{background:var(--stone-dim); color:var(--ink);}
.modal-body{padding:22px 24px 26px;}
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:var(--navy);
  margin-bottom:6px;
}
.field input, .field select, .field textarea{
  width:100%;
  padding:11px 13px;
  border:1.5px solid var(--line);
  border-radius:4px;
  background:#fff;
  font-size:14px;
  color:var(--ink);
}
.field textarea{resize:vertical; min-height:70px; line-height:1.6;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--navy);}
.field input[type="file"]{
  padding:9px 13px;
  font-size:13px;
  background:#fff;
}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.media-current{
  margin-top:8px;
  font-family:var(--data);
  font-size:12px;
  color:#8A8577;
}
.media-current img{
  display:block;
  max-width:140px;
  border-radius:4px;
  margin-top:6px;
  border:1px solid var(--line);
}
.type-toggle{display:flex; gap:10px;}
.type-toggle label{
  flex:1;
  text-align:center;
  padding:10px;
  border:1.5px solid var(--line);
  border-radius:4px;
  font-size:14px;
  font-weight:700;
  color:#6B6858;
  cursor:pointer;
  transition:all .15s ease;
}
.type-toggle input{display:none;}
.type-toggle input:checked + span{color:inherit;}
.type-toggle label:has(input:checked){
  border-color:var(--navy);
  background:var(--navy);
  color:#fff;
}
.modal-footer{
  display:flex; gap:10px;
  margin-top:6px;
}
.modal-footer .btn{flex:1;}
.field-error{
  font-family:var(--data);
  font-size:12px;
  color:var(--brick);
  margin-top:5px;
  display:none;
}
.field.invalid input, .field.invalid select{border-color:var(--brick);}
.field.invalid .field-error{display:block;}
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:var(--navy);
  color:#fff;
  padding:13px 20px;
  border-radius:4px;
  font-size:14px;
  font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.4);
  z-index:80;
  animation:riseIn .2s ease;
}
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
footer{
  text-align:center;
  padding:22px;
  font-family:var(--data);
  font-size:12px;
  color:#A7A18E;
  border-top:1px solid var(--line);
}
.backup-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}
.backup-actions button{
  font-family:var(--body);
  font-size:12px;
  font-weight:700;
  color:var(--navy);
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:4px;
  padding:9px 14px;
  cursor:pointer;
}
.backup-actions button:hover{background:var(--stone-dim);}

/* ---------- شاشة كلمة المرور ---------- */
#lockScreen{
  position:fixed; inset:0; z-index:1000;
  background:var(--navy);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.lock-box{
  background:var(--stone);
  border-radius:8px;
  padding:40px 32px;
  max-width:360px;
  width:100%;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  border-top:4px solid var(--gold);
}
.lock-mark{
  width:52px; height:52px;
  margin:0 auto 16px;
  border:2px solid var(--gold);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold);
}
.lock-mark svg{width:24px; height:24px;}
.lock-box h2{
  font-family:var(--display);
  font-size:20px;
  color:var(--navy);
  margin-bottom:6px;
}
.lock-box p{
  font-size:13px;
  color:#7A7666;
  margin-bottom:20px;
}
.lock-box input{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:6px;
  padding:12px 14px;
  font-size:16px;
  text-align:center;
  letter-spacing:2px;
  outline:none;
  margin-bottom:12px;
  background:#fff;
  color:var(--ink);
}
.lock-box input:focus{border-color:var(--navy);}
.lock-box input.invalid{border-color:var(--brick); animation:shake .3s ease;}
@keyframes shake{
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}
.lock-box .btn{width:100%; padding:13px;}
.lock-err{
  font-size:12.5px; color:var(--brick);
  min-height:16px; margin-bottom:8px; font-weight:600;
}
#app.locked{display:none;}
</style>
</head>
<body>

<!-- ---------- شاشة كلمة المرور ---------- -->
<div id="lockScreen">
  <form class="lock-box" id="lockForm" autocomplete="off">
    <div class="lock-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h2>الدخول محمي بكلمة مرور</h2>
    <p>من فضلك أدخل كلمة المرور للمتابعة إلى الموقع</p>
    <input type="password" id="lockInput" placeholder="كلمة المرور" inputmode="numeric" autofocus>
    <div class="lock-err" id="lockErr"></div>
    <button type="submit" class="btn btn-primary">دخول</button>
  </form>
</div>

<div id="app" class="locked"></div>
<script>
const STORAGE_KEY = 'almalek_listings_v1';

const CATEGORIES = {
  flats:   { name:'شقق',           hasType:true,  unit:'م²',   icon:'flats',  accent:'navy',
             types:[{value:'sale',label:'تمليك'},{value:'rent',label:'إيجار'}],
             hasFloor:true, hasDescription:true },
  shops:   { name:'محلات',         hasType:true,  unit:'م²',   icon:'shops',  accent:'brick',
             types:[{value:'sale',label:'تمليك'},{value:'rent',label:'إيجار'}] },
  houses:  { name:'بيوت',          hasType:false, unit:'م²',   icon:'houses', accent:'gold',
             hasDescription:true },
  land:    { name:'أراضي زراعية',  hasType:true,  unit:'فدان', icon:'land',   accent:'green',
             types:[{value:'agricultural',label:'أرض زراعية'},{value:'cordon',label:'أراضي كردون'},{value:'near_cordon',label:'أراضي بجوار الكردون'}] }
};

const ICONS = {
  flats:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="16" width="34" height="27" rx="1"/><path d="M7 16 24 5l17 11"/><rect x="14" y="24" width="6" height="6"/><rect x="28" y="24" width="6" height="6"/><rect x="20" y="34" width="8" height="9"/></svg>`,
  shops:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 14 9 6h30l3 8"/><path d="M6 14v4a4 4 0 0 0 8 0 4 4 0 0 0 8 0 4 4 0 0 0 8 0 4 4 0 0 0 8 0 4 4 0 0 0 8 0v-4"/><path d="M9 18v20h30V18"/><rect x="20" y="27" width="8" height="11"/></svg>`,
  houses:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22 24 7l18 15"/><path d="M10 20v21h28V20"/><rect x="20" y="28" width="8" height="13"/><rect x="14" y="24" width="5" height="5"/></svg>`,
  land:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 34 14 18l8 10 6-8 16 14"/><path d="M4 40h40"/><path d="M12 34v-6M22 30v-5M30 26v-5"/></svg>`,
  search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`
};

const SEED = [
  {id:'s1', cat:'flats', type:'sale', region:'مدينة نصر، الحي السابع', area:'150', price:'2,400,000', owner:'أحمد فتحي', phone:'01012345678'},

  {id:'s3', cat:'shops', type:'sale', region:'وسط البلد، شارع طلعت حرب', area:'45', price:'3,100,000', owner:'كريم يوسف', phone:'01234567890'},

let listings = loadListings();
let state = { view:'home', cat:null, filter:'all', homeQ:'' };

function loadListings(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED));
    return JSON.parse(JSON.stringify(SEED));
  }catch(e){ return JSON.parse(JSON.stringify(SEED)); }
}
function saveListings(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(listings)); }catch(e){}
}

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function catListings(cat){ return listings.filter(l => l.cat === cat); }

function matchesQuery(l, q){
  if(!q) return true;
  return (l.region||'').includes(q) || (l.owner||'').includes(q) || (l.phone||'').includes(q);
}

function filteredListings(){
  let items = catListings(state.cat);
  if(CATEGORIES[state.cat].hasType && state.filter !== 'all'){
    items = items.filter(l => l.type === state.filter);
  }
  return items;
}

function homeSearchResults(){
  const q = state.homeQ.trim();
  if(!q) return [];
  return listings.filter(l => matchesQuery(l, q));
}

function goHome(){ state = {view:'home', cat:null, filter:'all', homeQ:''}; render(); }
function goCategory(cat){ state = {view:'category', cat, filter:'all', homeQ:''}; render(); window.scrollTo({top:0}); }

function render(){
  const app = document.getElementById('app');

function listingDetailsText(l){
  const c = CATEGORIES[l.cat];
  const typeObj = c.hasType ? (c.types.find(t => t.value === l.type) || c.types[0]) : null;
  const lines = [];
  lines.push(`🏠 ${c.name}${typeObj ? ' — ' + typeObj.label : ''}`);
  lines.push(`📍 المنطقة: ${l.region}`);
  if(l.address) lines.push(`🗺️ العنوان بالتفصيل: ${l.address}`);
  lines.push(`📐 المساحة: ${l.area} ${c.unit}`);
  if(l.floor) lines.push(`🏢 الدور: ${l.floor}`);
  lines.push(`💰 السعر: ${l.price}`);
  if(l.description) lines.push(`📝 الوصف: ${l.description}`);
  return lines.join('\n');
}

async function copyListingDetails(id){
  const item = listings.find(l => l.id === id);
  if(!item) return;
  const text = listingDetailsText(item);

  let copied = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(text);
      copied = true;
    }catch(err){ copied = false; }
  }
  if(!copied){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
       ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      copied = document.execCommand('copy');
      ta.remove();
    }catch(err){ copied = false; }
  }

  if(copied){
    showToast('تم نسخ التفاصيل، الصقها في الواتساب');
  }else{
    showCopyFallbackModal(text);
  }
}

function showCopyFallbackModal(text){

        <textarea id="copyFallbackText" readonly rows="10" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:4px;font-size:13px;line-height:1.7;font-family:var(--body);"></textarea>

}

async function onAddSubmit(e){
  e.preventDefault();
  try{
    await handleAddSubmit(e);
  }catch(err){
    console.error('addForm error:', err);
    showToast('حصلت مشكلة أثناء الحفظ، حاول تاني');
  }
}

function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function handleAddSubmit(e){
  const form = e.target;
  const data = Object.fromEntries(new FormData(form).entries());
  const wasEditing = !!editingId;
  const existing = wasEditing ? listings.find(l => l.id === editingId) : null;
  const cat = existing ? existing.cat : state.cat;
  const c = CATEGORIES[cat];

  const required = ['region','area','price','owner','phone'];
  let valid = true;
  required.forEach(key => {
    const field = document.getElementById('f-' + key);
    const ok = (data[key] || '').trim().length > 0;
    if(!ok) valid = false;
    field.classList.toggle('invalid', !ok);
  });
  const cleanPhone = (data.phone||'').replace(/[\s-]/g,'');
  const phoneOk = /^0[0-9]{9,10}$/.test(cleanPhone);
  if(!phoneOk){
    valid = false;
    document.getElementById('f-phone').classList.add('invalid');
  }
  if(!valid){
    showToast('في بيانات ناقصة أو غلط، راجع الحقول المظلّلة بالأحمر');
    return;
  }
  data.phone = cleanPhone;

  let media = existing ? existing.media : undefined;
  let mediaType = existing ? existing.mediaType : undefined;
  const fileInput = form.querySelector('[name="media"]');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(file){
    try{
      media = await fileToDataURL(file);
      mediaType = file.type.startsWith('video') ? 'video' : 'image';
    }catch(err){
      console.error('media read error:', err);
      showToast('تعذّر تحميل الصورة/الفيديو، حاول باختيار ملف تاني');
      return;
    }
  }

  const item = {
    id: wasEditing ? editingId : uid(),
    cat,
    type: c.hasType ? (data.type || c.types[0].value) : undefined,
    region: data.region.trim(),
    address: (data.address || '').trim(),
    area: data.area.trim(),
    price: data.price.trim(),
    owner: data.owner.trim(),
    phone: data.phone.trim(),
    floor: c.hasFloor ? (data.floor || '').trim() : undefined,
    description: c.hasDescription ? (data.description || '').trim() : undefined,
    media,
    mediaType
  };

  if(wasEditing){
    const idx = listings.findIndex(l => l.id === editingId);
    if(idx > -1) listings[idx] = item;
  }else{
    listings.unshift(item);
  }
  saveListings();
  closeModal();
  render();
  showToast(wasEditing ? 'تم حفظ التعديلات' : 'تم إضافة العقار بنجاح');
}

function deleteListing(id){
  const item = listings.find(l => l.id === id);
  if(!item) return;
  const ok = confirm(`هل تريد حذف عقار "${item.region}"؟ لا يمكن التراجع عن هذا الإجراء.`);
  if(!ok) return;
  listings = listings.filter(l => l.id !== id);
  saveListings();
  render();
  showToast('تم حذف العقار');
}

function exportBackup(){
  try{
    const payload = {
      app: 'almalek-realestate',
      exportedAt: new Date().toISOString(),
      listings
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `المالك-نسخة-احتياطية-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('اتحملت النسخة الاحتياطية، احفظيها في مكان آمن');
  }catch(err){
    console.error('export error:', err);
    showToast('تعذّر إنشاء النسخة الاحتياطية');
  }
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const payload = JSON.parse(reader.result);
      const incoming = Array.isArray(payload) ? payload : payload.listings;
      if(!Array.isArray(incoming)) throw new Error('صيغة الملف غير صحيحة');

      const ok = confirm(`الملف فيه ${incoming.length} عقار. هل تريدين استبدال البيانات الحالية بها بالكامل؟`);
      if(!ok) return;

      listings = incoming;
      saveListings();
      render();
      showToast('تم استرجاع النسخة الاحتياطية بنجاح');
    }catch(err){
      console.error('import error:', err);
      showToast('الملف ده مش نسخة احتياطية صحيحة');
    }
  };
  reader.onerror = () => showToast('تعذّر قراءة الملف');
  reader.readAsText(file);
}

let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.id = 'toast';
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2400);
}

document.addEventListener('click', (e) => {
  const brand = e.target.closest('#brandHome');
  if(brand){ goHome(); return; }

  const catBtn = e.target.closest('[data-cat]');
  if(catBtn){ goCategory(catBtn.dataset.cat); return; }

  const backBtn = e.target.closest('#backBtn');
  if(backBtn){ goHome(); return; }

  const addBtn = e.target.closest('#addBtn');
  if(addBtn){ openAddModal(null); return; }

  const searchBtn = e.target.closest('#homeSearchBtn');
  if(searchBtn){
    const input = document.getElementById('homeSearchInput');
    state.homeQ = input ? input.value : state.homeQ;
    document.getElementById('homeResults').innerHTML = homeResultsHTML();
    return;
  }

  const filterBtn = e.target.closest('[data-filter]');
  if(filterBtn){
    state.filter = filterBtn.dataset.filter;
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === state.filter));
    const items = filteredListings();
    document.querySelector('.result-count').textContent = items.length + ' نتيجة';
    const listArea = document.querySelector('.listings') || document.querySelector('.empty-state');
    listArea.outerHTML = items.length ? `<div class="listings">${items.map(l => propertyCardHTML(l, false)).join('')}</div>` : emptyStateHTML();
    return;
  }

  const delBtn = e.target.closest('[data-del]');
  if(delBtn){ deleteListing(delBtn.dataset.del); return; }

  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){
    const item = listings.find(l => l.id === editBtn.dataset.edit);
    if(item) openAddModal(item);
    return;
  }

  const callBtn = e.target.closest('[data-call]');
  if(callBtn){ window.location.href = 'tel:' + callBtn.dataset.call; return; }

  const copyBtn = e.target.closest('[data-copy]');
  if(copyBtn){ copyListingDetails(copyBtn.dataset.copy); return; }

  const closeCopyBtn = e.target.closest('#closeCopyModal');
  if(closeCopyBtn){ const ov = document.getElementById('copyOverlay'); if(ov) ov.remove(); return; }

  if(e.target.id === 'copyOverlay'){ e.target.remove(); return; }

  const backupBtn = e.target.closest('#backupBtn');
  if(backupBtn){ exportBackup(); return; }

  const restoreBtn = e.target.closest('#restoreBtn');
  if(restoreBtn){ const fi = document.getElementById('restoreFileInput'); if(fi) fi.click(); return; }

  const closeBtn = e.target.closest('#closeModal, #cancelAdd');
  if(closeBtn){ closeModal(); return; }

  if(e.target.id === 'overlay'){ closeModal(); return; }
});

document.addEventListener('input', (e) => {
  if(e.target.id === 'homeSearchInput'){
    state.homeQ = e.target.value;
    document.getElementById('homeResults').innerHTML = homeResultsHTML();
  }
});

document.addEventListener('change', (e) => {
  if(e.target.id === 'restoreFileInput'){
    const file = e.target.files && e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'brandHome'){
    goHome();
  }
  if(e.key === 'Escape'){ closeModal(); }
});

document.addEventListener('submit', (e) => {
  if(e.target && e.target.id === 'addForm'){ onAddSubmit(e); }
});

const LOCK_PASSWORD = '01501306464';
const LOCK_SESSION_KEY = 'almalek_unlocked_v1';

function unlockSite(){
  const lock = document.getElementById('lockScreen');
  const app = document.getElementById('app');
  if(lock) lock.remove();
  if(app) app.classList.remove('locked');
}

function checkLockState(){
  if(sessionStorage.getItem(LOCK_SESSION_KEY) === '1'){
    unlockSite();
  }
}

document.addEventListener('submit', (e) => {
  if(e.target && e.target.id === 'lockForm'){
    e.preventDefault();
    const input = document.getElementById('lockInput');
    const err = document.getElementById('lockErr');
    const value = (input.value || '').trim();
    if(value === LOCK_PASSWORD){
      sessionStorage.setItem(LOCK_SESSION_KEY, '1');
      unlockSite();
    }else{
      err.textContent = 'كلمة المرور غير صحيحة، حاول مرة أخرى';
      input.classList.add('invalid');
      input.value = '';
      input.focus();
      setTimeout(() => input.classList.remove('invalid'), 300);
    }
  }
});

checkLockState();

render();

</script>
